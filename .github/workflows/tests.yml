name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: .tests/plenary
      - name: Offline tests (no Codex login)
        env:
          PLENARY_DIR: ${{ github.workspace }}/.tests/plenary
        run: make test
